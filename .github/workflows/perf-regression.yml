name: Gold Predictor performance regression

on:
  pull_request:
    paths:
      - "app.py"
      - "gold_forecast/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/perf-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile application and modules
        run: python -m compileall -q app.py gold_forecast tests
      - name: Run regression tests
        run: python -m pytest -q tests
